<svg width="200" height="150" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
    <!-- Wheels -->
    <circle cx="40" cy="110" r="25" fill="white" stroke="#333" stroke-width="5"/>
    <circle cx="160" cy="110" r="25" fill="white" stroke="#333" stroke-width="5"/>

    <!-- Scooter Deck -->
    <rect x="45" y="90" width="115" height="10" rx="5" fill="#3498db"/>

    <!-- Steering Column -->
    <line x1="160" y1="90" x2="160" y2="40" stroke="#333" stroke-width="5" stroke-linecap="round"/>

    <!-- Handlebar -->
    <line x1="140" y1="40" x2="180" y2="40" stroke="#333" stroke-width="5" stroke-linecap="round"/>

    <!-- Brake Lever -->
    <line x1="140" y1="40" x2="135" y2="50" stroke="#333" stroke-width="3" stroke-linecap="round"/>

    <!-- Battery Area -->
    <rect x="70" y="75" width="50" height="15" rx="3" fill="#2c3e50"/>

    <!-- Front Light -->
    <circle cx="160" cy="85" r="5" fill="#f1c40f"/>

    <!-- Logo Text -->
    <text x="100" y="140" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">SCOOTERS</text>
</svg>